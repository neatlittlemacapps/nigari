name: Release

# Every push to main becomes a release of this fork (#265): prebuilt binaries
# for every platform on a GitHub Release, and the container image. install.sh,
# the admin's update notice and the Docker instructions all read from here.
# Before, the fork had no releases, so installing it gave upstream's v1.1.4.
#
# The version: the fork's own patch line. The next number after the highest
# fork tag on the line named by server.Version's major.minor, so every release
# sorts above upstream's v1.1.x tags that the fork carries. A line with no tag
# yet releases server.Version itself: the first nigari release is v2.0.0, not
# v2.0.1 (spec 011, research R11).
# server/update.go only treats plain x.y.z as a release, which is why this is
# not "1.6.8+42". A pushed v* tag still releases as itself.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

# Two pushes in quick succession must not both take the same next number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            base=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' server/backup.go)
            line="${base%.*}"
            last=$(git tag -l "v${line}.*" --sort=-v:refname | head -n1)
            # A line with releases continues from its last; a line nobody has
            # released yet starts at server.Version itself (v2.0.0, spec 011).
            if [ -n "$last" ]; then version="v${line}.$(( ${last##*.} + 1 ))"; else version="v${base}"; fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Build the frontend once — it's the same embedded static bundle for
      # every OS/arch, so we reuse web/dist across all cross-compiles.
      #
      # NIGARI_VERSION is not optional here. The frontend stamps it in and
      # compares it against the version the server reports; built without it
      # the bundle says "dev", the binary says "v1.0.0", and every page load
      # raises "a new version is available" that reloading never clears. That
      # shipped in v1.0.0 and is what this env block exists to prevent.
      - name: Build frontend
        run: make frontend
        env:
          NIGARI_VERSION: ${{ steps.v.outputs.version }}

      - name: Cross-compile binaries
        run: |
          set -eu
          VERSION="${{ steps.v.outputs.version }}"
          mkdir -p dist
          build() {
            os="$1"; arch="$2"; ext="${3:-}"
            out="dist/nigari-${os}-${arch}${ext}"
            echo "→ $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-s -w -X nigari/server.Version=${VERSION}" \
              -o "$out" .
          }
          build linux  amd64
          build linux  arm64
          build darwin amd64
          build darwin arm64
          build windows amd64 .exe
          ( cd dist && sha256sum nigari-* > SHA256SUMS.txt )
          ls -lh dist

      # The action creates the tag on this commit. A tag pushed with
      # GITHUB_TOKEN would not start other workflows, which is why the image
      # is a job below rather than docker.yml reacting to the tag.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # /releases/latest (install.sh, the update notice) skips
          # prereleases, so these are full releases, and the latest.
          prerelease: false
          make_latest: "true"

  image:
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.build.outputs.version }}
    permissions:
      contents: read
      packages: write

  # The Umbrel store pins one release by version and image digest, so Umbrel
  # installs exactly the image that was built and offers an update only when
  # the version changes. Moving the pin by hand was forgotten: the store sat
  # at 2.1.15 while main released 2.1.21 (owner, 2026-11-12: automate it).
  #
  # This opens a pull request on the store repository; the owner merges it,
  # so a release reaches Umbrels only when the owner says so. It does not
  # write nigari's own umbrel/ copy: a commit to main is a release, and a
  # release that commits to main would release again, forever.
  #
  # Needs the secret UMBREL_STORE_TOKEN: a fine-grained token for
  # neatlittlemacapps/yokogaki-umbrel only, Contents and Pull requests
  # read/write. Without it the job says so and passes; the release is done.
  umbrel-store:
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.UMBREL_STORE_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
      STORE: neatlittlemacapps/yokogaki-umbrel
    steps:
      - name: Open a pull request on the Umbrel store
        run: |
          set -eu
          if [ -z "${GH_TOKEN}" ]; then
            echo "UMBREL_STORE_TOKEN is not set; the Umbrel store was not updated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ver="${VERSION#v}"
          image="ghcr.io/${GITHUB_REPOSITORY}:${ver}"
          # The index digest, covering amd64 and arm64: the one Umbrel pins.
          digest=$(docker buildx imagetools inspect "${image}" --format '{{json .Manifest}}' | jq -r .digest)
          case "${digest}" in sha256:*) ;; *) echo "No digest for ${image}" >&2; exit 1 ;; esac

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${STORE}.git" store
          cd store
          app=yokogaki-nigari
          sed -i -E "s|^version: \".*\"$|version: \"${ver}\"|" "${app}/umbrel-app.yml"
          sed -i -E "s|(releases/tag/)v[0-9.]+|\1v${ver}|" "${app}/umbrel-app.yml"
          sed -i -E "s|(image: ghcr.io/[^:]+/nigari):[^@]+@sha256:[0-9a-f]+|\1:${ver}@${digest}|" "${app}/docker-compose.yml"
          grep -q "version: \"${ver}\"" "${app}/umbrel-app.yml"
          grep -q "nigari:${ver}@${digest}" "${app}/docker-compose.yml"
          if git diff --quiet; then
            echo "The store already pins ${ver}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="nigari-${ver}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git commit -qam "nigari ${ver}"
          git push -f origin "${branch}"
          # One open pull request per release; an older one stays until the
          # owner merges or closes it, and the newest one supersedes it.
          if [ -z "$(gh pr list --repo "${STORE}" --head "${branch}" --json number --jq '.[].number')" ]; then
            gh pr create --repo "${STORE}" --base main --head "${branch}" \
              --title "nigari ${ver}" \
              --body "Moves the store to nigari ${ver} (${digest}). Release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${ver}. Merge it and Umbrel offers the update within about 5 minutes."
          fi
          echo "Opened a pull request on ${STORE} for ${ver}." >> "$GITHUB_STEP_SUMMARY"
