name: Docker

# Build the container image and push it to this repository's GHCR image
# (ghcr.io/<owner>/<repo>; the fork cannot push to saltmd's). Called by
# release.yml with the version it just released, and can be run by hand for an
# existing version.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to build, as released (with or without the leading v)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (without leading v), e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          ver="${{ inputs.version }}"
          echo "ver=${ver#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.ver }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.ver }}
            ghcr.io/${{ github.repository }}:latest
