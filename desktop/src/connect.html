<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>nigari</title>
<style>
  /* Follows the system theme, because this page is the first thing anybody
     sees and a white flash into a dark workspace is a poor greeting. */
  :root {
    --bg: #ffffff; --fg: #37352f; --muted: #787774;
    --border: #e9e7e4; --accent: #2f7d4f; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --fg: #d4d4d4; --muted: #8f8f8f;
      --border: #2f2f2f; --accent: #4fa872; --card: #242424;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    /* Leaves room for the traffic lights, which sit inside the window. */
    padding-top: 28px;
    -webkit-user-select: none; user-select: none;
    /* The whole background drags the window — there is no title bar to grab. */
    -webkit-app-region: drag;
  }
  .card { width: 380px; max-width: calc(100vw - 48px); text-align: center; -webkit-app-region: no-drag; }
  /* The real mark, not the 🧂 emoji: the emoji is somebody else's
     drawing and looks different on every platform, and this is the first screen
     anybody sees. */
  .mark { width: 54px; height: 54px; margin: 0 auto 16px; display: block; color: var(--fg); }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
  input {
    width: 100%; padding: 11px 13px; font: inherit; font-size: 14px;
    color: var(--fg); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 10px; padding: 11px 13px;
    font: inherit; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 34px; color: var(--muted); }
  .msg.bad { color: #c4554d; }
  .hint { margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .back {
    display: inline-block; margin-top: 16px;
    color: var(--muted); font-size: 13px; text-decoration: none;
    -webkit-app-region: no-drag;
  }
  .back:hover { color: var(--fg); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><clipPath id="nigari-connect-mark-clip"><path d="M16 200.594C16 169.187 41.5178 146.346 72.7458 149.736L251.549 169.544C302.584 174.897 344.341 220.936 344.341 271.972V359.411C344.341 373.151 331.314 388.14 320.25 391.352L48.6556 468.976C30.6326 474.151 16 462.909 16 444.351V200.594Z"/></clipPath></defs><path d="M16 200.594C16 169.187 41.5178 146.346 72.7458 149.736L251.549 169.544C302.584 174.897 344.341 220.936 344.341 271.972V359.411C344.341 373.151 331.314 388.14 320.25 391.352L48.6556 468.976C30.6326 474.151 16 462.909 16 444.351V200.594Z" fill="#A98AFB"/><path d="M130.177 106.035C130.177 66.7773 162.119 38.0479 201.2 42.1521L389.465 61.7809C447.997 68.0264 496 121.202 496 180.089V359.424C496 386.904 473.872 405.106 446.926 399.752C404.99 391.544 370.5 377 346 384C309.812 394.339 304.5 395.981 164.439 435.619C145.523 440.973 130.177 429.374 130.177 409.745V106.035Z" fill="#6542E8"/><path d="M130.177 106.035C130.177 66.7773 162.119 38.0479 201.2 42.1521L389.465 61.7809C447.997 68.0264 496 121.202 496 180.089V359.424C496 386.904 473.872 405.106 446.926 399.752C404.99 391.544 370.5 377 346 384C309.812 394.339 304.5 395.981 164.439 435.619C145.523 440.973 130.177 429.374 130.177 409.745V106.035Z" fill="#391FA2" clip-path="url(#nigari-connect-mark-clip)"/></svg>
    <h1>Connect to your nigari</h1>
    <p class="sub">This app is a window onto a server you run.<br>Your data stays there.</p>

    <input id="url" type="text" placeholder="nigari.example.com" autocomplete="off" spellcheck="false" autofocus>
    <button id="go">Connect</button>
    <div class="msg" id="msg"></div>

    <!-- Only when there is somewhere to go back TO. Opening the settings and
         finding no way out is the complaint this whole screen just answered;
         repeating it one level down would be worse. -->
    <a id="back" class="back" href="#" hidden>Back to my workspace</a>

    <p class="hint">
      No server yet? nigari is one binary you run yourself —<br>
      see <code>nigari</code> for how to start one.
    </p>
  </div>

<script>
  const $url = document.getElementById('url');
  const $go = document.getElementById('go');
  const $msg = document.getElementById('msg');

  const say = (text, bad = false) => {
    $msg.textContent = text;
    $msg.className = 'msg' + (bad ? ' bad' : '');
  };

  // Arriving here from a failed load rather than from the menu: say what
  // happened instead of showing an empty form that looks like a fresh start.
  const params = new URLSearchParams(location.search);
  if (params.get('error')) {
    const target = params.get('url') || '';
    say('Could not reach ' + (target ? new URL(target).origin : 'the server') + '. Is it running?', true);
  }

  // Prefill whatever is configured, so changing the server is an edit and not
  // retyping an address from memory — and offer the way back out.
  const $back = document.getElementById('back');
  window.nigari.getServer().then((s) => {
    if (!s) return;
    $url.value = s;
    $back.hidden = false;
  });
  $back.addEventListener('click', (e) => {
    e.preventDefault();
    void window.nigari.cancel();
  });

  const connect = async () => {
    const value = $url.value.trim();
    if (!value) return;
    $go.disabled = true;
    say('Looking for a nigari there…');
    const res = await window.nigari.setServer(value);
    if (res.ok) {
      say('Found it. Opening…');
      return; // the main process navigates the window
    }
    $go.disabled = false;
    if (res.error === 'not-a-url') say('That does not look like an address.', true);
    else if (res.error === 'not-nigari') say('Something answered there, but it is not a nigari.', true);
    else say('Nothing answered there. Check the address, and that the server is running.', true);
  };

  $go.addEventListener('click', connect);
  $url.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
